name: weave
resolution: workspace
description: "Weave desktop app: coordinate AI coding agents from one request."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_svg: ^2.3.0
  path: ^1.9.1
  weave_agents: ^1.0.0
  weave_core: ^1.0.0
  weave_git: ^1.0.0
  weave_storage: ^1.0.0
  weave_workflow: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/poppins/OFL.txt
    - assets/icons/
    - assets/icons/brand/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
